<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 外側の太い円 -->
  <circle cx="50" cy="50" r="48" fill="black"/>
  <circle cx="50" cy="50" r="38" fill="white"/>

  <!-- 外側の5枚の花弁 -->
  <ellipse cx="50" cy="22" rx="10" ry="14" fill="black"/>
  <ellipse cx="72" cy="38" rx="10" ry="14" fill="black" transform="rotate(72 72 38)"/>
  <ellipse cx="68" cy="68" rx="10" ry="14" fill="black" transform="rotate(144 68 68)"/>
  <ellipse cx="32" cy="68" rx="10" ry="14" fill="black" transform="rotate(216 32 68)"/>
  <ellipse cx="28" cy="38" rx="10" ry="14" fill="black" transform="rotate(288 28 38)"/>

  <!-- 内側の5枚の花弁 -->
  <ellipse cx="50" cy="40" rx="7" ry="10" fill="black"/>
  <ellipse cx="62" cy="50" rx="7" ry="10" fill="black" transform="rotate(72 62 50)"/>
  <ellipse cx="56" cy="62" rx="7" ry="10" fill="black" transform="rotate(144 56 62)"/>
  <ellipse cx="44" cy="62" rx="7" ry="10" fill="black" transform="rotate(216 44 62)"/>
  <ellipse cx="38" cy="50" rx="7" ry="10" fill="black" transform="rotate(288 38 50)"/>
</svg>
